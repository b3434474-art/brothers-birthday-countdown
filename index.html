<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎂 Birthday Countdown!</title>
<link rel="stylesheet" href="style.css?v=20260812-1">
</head>
<body>
<div class="stars"></div>
<main class="card">
<div class="emoji">🎂</div>
<h1 id="title">Birthday Countdown!</h1>
<p id="subtitle">Counting down to August 12 at midnight 🎈</p>
<div class="count" id="count"><div class="unit"><span class="num" id="days">Loading…</span><span class="label">Days</span></div><div class="unit"><span class="num" id="hours">Loading…</span><span class="label">Hours</span></div><div class="unit"><span class="num" id="minutes">Loading…</span><span class="label">Minutes</span></div><div class="unit"><span class="num" id="seconds">Loading…</span><span class="label">Seconds</span></div></div>
<div class="celebrate" id="celebrate">🎉 HAPPY BIRTHDAY! 🎉</div>
<button id="party">🎊 PARTY MODE</button>
<div class="soundboard"><small>🔊 Soundboard — tap to test the effects</small><button id="cheer">📣 CHEER</button><button id="airhorn">📯 AIR HORN</button><button id="tada">🎺 TADA</button></div>
</main>
<script src="script.js?v=20260812-1" defer></script>
</body>
</html>
