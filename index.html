<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎂 Birthday Countdown!</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#4b1d7a,#10052b 65%,#05020f);color:white;display:grid;place-items:center;text-align:center}.stars{position:fixed;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:45px 45px;opacity:.25;animation:drift 20s linear infinite}@keyframes drift{to{background-position:90px 90px}}.card{position:relative;z-index:5;width:min(92%,850px);padding:35px 20px;border:2px solid #ffffff44;border-radius:30px;background:#ffffff12;backdrop-filter:blur(12px);box-shadow:0 0 60px #b44cff55}.emoji{font-size:clamp(3rem,10vw,6rem);animation:bounce 1.4s infinite}@keyframes bounce{50%{transform:translateY(-18px) rotate(4deg)}}h1{font-size:clamp(2.2rem,8vw,5rem);margin:5px 0;text-shadow:0 0 25px #ff8cff}p{font-size:1.2rem}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px auto;max-width:700px}.unit{padding:20px 8px;border-radius:20px;background:#0005;border:1px solid #fff2;box-shadow:inset 0 0 20px #fff1}.num{display:block;font-size:clamp(2rem,7vw,4rem);font-weight:900}.label{opacity:.75;text-transform:uppercase;font-size:.75rem;letter-spacing:2px}.celebrate{display:none;font-size:clamp(2rem,7vw,5rem);animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.08);text-shadow:0 0 40px #fff}}button{border:0;border-radius:999px;padding:14px 24px;margin:5px;font-size:1rem;font-weight:800;cursor:pointer;background:white;color:#35105e}.soundboard{margin-top:15px}.soundboard small{display:block;opacity:.7;margin-bottom:7px}.balloon{position:fixed;bottom:-100px;font-size:45px;z-index:2;animation:rise linear forwards;pointer-events:none}@keyframes rise{to{transform:translateY(-120vh) rotate(20deg);opacity:0}}.confetti{position:fixed;top:-20px;width:9px;height:15px;z-index:10;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:600px){.count{grid-template-columns:repeat(2,1fr)}button{padding:12px 17px}}
</style>
</head>
<body>
<div class="stars"></div>
<main class="card">
<div class="emoji">🎂</div>
<h1 id="title">Birthday Countdown!</h1>
<p id="subtitle">Counting down to August 12 at midnight 🎈</p>
<div class="count" id="count"><div class="unit"><span class="num" id="days">0</span><span class="label">Days</span></div><div class="unit"><span class="num" id="hours">0</span><span class="label">Hours</span></div><div class="unit"><span class="num" id="minutes">0</span><span class="label">Minutes</span></div><div class="unit"><span class="num" id="seconds">0</span><span class="label">Seconds</span></div></div>
<div class="celebrate" id="celebrate">🎉 HAPPY BIRTHDAY! 🎉</div>
<button id="party">🎊 PARTY MODE</button>
<div class="soundboard"><small>🔊 Soundboard — tap to test the effects</small><button id="cheer">📣 CHEER</button><button id="airhorn">📯 AIR HORN</button><button id="tada">🎺 TADA</button></div>
</main>
<script>
// Birthday begins every August 12 at 12:00 AM local time.
function nextBirthday(){const now=new Date();let y=now.getFullYear();let d=new Date(y,7,12,0,0,0);if(now>=d)d=new Date(y+1,7,12,0,0,0);return d}
let target=nextBirthday(),birthday=false;
const $=id=>document.getElementById(id);

// Tiny synthesized soundboard: no audio files or external services needed.
let audioCtx;
function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,duration,type='sine',volume=.12,delay=0){const ctx=audio(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+delay);g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+duration+.03)}
function tada(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.14,i*.13))}
function cheer(){[440,554,659,880,988].forEach((f,i)=>tone(f,.18,'square',.08,i*.09));tone(1200,.5,'sawtooth',.06,.48)}
function airhorn(){tone(110,.7,'sawtooth',.18);tone(155,.7,'sawtooth',.16,.08);tone(205,.55,'sawtooth',.12,.16)}
function birthdaySounds(){airhorn();setTimeout(()=>tada(),650);setTimeout(()=>cheer(),1500);setTimeout(()=>tada(),2600)}

function confetti(n=80){for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${Math.random()*360},100%,65%)`;c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}
function balloons(){for(let i=0;i<5;i++){const e=document.createElement('div');e.className='balloon';e.textContent='🎈';e.style.left=Math.random()*100+'vw';e.style.animationDuration=(5+Math.random()*6)+'s';e.style.animationDelay=i*.3+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),12000)}}
function update(){const now=new Date();let diff=target-now;if(diff<=0){if(!birthday){birthday=true;celebration()}return}const s=Math.floor(diff/1000);$("days").textContent=Math.floor(s/86400);$("hours").textContent=Math.floor(s%86400/3600);$("minutes").textContent=Math.floor(s%3600/60);$("seconds").textContent=s%60}
function celebration(){target=nextBirthday();$("title").textContent='🎉 HAPPY BIRTHDAY! 🎉';$("subtitle").textContent='IT’S MIDNIGHT! THE PARTY HAS STARTED! 🔊🎂';$("count").style.display='none';$("celebrate").style.display='block';confetti(220);balloons();birthdaySounds();setInterval(()=>{confetti(55);balloons()},3500)}
$("party").onclick=()=>{confetti(140);balloons();cheer()};$("cheer").onclick=cheer;$("airhorn").onclick=airhorn;$("tada").onclick=tada;
setInterval(update,250);update();
</script>
</body>
</html>
